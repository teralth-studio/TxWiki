<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
    <!--[if !mso]><!-->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Roboto:wght@400&amp;display=swap" rel="stylesheet" type="text/css">
    <!--<![endif]-->
    <style type="text/css">
      @media (max-width: 480px) {
        .header-logo, .header-title {
          display: block !important;
          width: 100% !important;
          text-align: center !important;
        }
        .header-logo img {
          margin: 0 auto 20px !important;
        }
        .header-title p {
          text-align: center !important;
        }
        .content-padding {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;min-width:100%;background-color:#ffffff;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;table-layout:fixed;mso-table-lspace:0pt;mso-table-rspace:0pt;">
      <tr>
        <td align="center" style="background-color:#ffffff;">
          <!--[if mso]>
          <table role="presentation" width="620" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:620px;border-collapse:collapse;table-layout:fixed;mso-table-lspace:0pt;mso-table-rspace:0pt;">
            <tr>
              <td class="content-padding" style="padding:22px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td class="header-logo" width="65" valign="middle" style="width:65px;">
                      <img src="https://fac83835-bf21-4334-9140-22e35fb45139.b-cdn.net/e/6195c248-5d47-4c35-8c31-941f663c9bfc/8d24bfd6-bdc3-453b-bbaa-5035dc982972.png" width="50" height="50" alt="" style="display:block;width:50px;height:50px;border:0;">
                    </td>
                    <td class="header-title" valign="middle" align="right">
                      <p style="margin:0;font-family:'Inter Tight',BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:20px;line-height:28px;font-weight:700;color:#222222;text-align:right;">Teralth Studio</p>
                      <p style="margin:0;font-family:'Inter Tight',BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:24px;font-weight:600;color:#777777;text-align:right;">System Notifications</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="content-padding" style="padding:40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;border-spacing:0;">
                  <tr>
                    <td style="padding:30px;border:1px solid #e3e3e3;border-radius:6px 6px 0 0;">
                      <p style="margin:0;font-family:'Inter Tight',BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:22px;font-weight:700;color:#222222;">Password changed</p>
                      <p style="margin:0;font-family:Roboto,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:22px;font-weight:400;color:#333333;">Hi, {{username}}! Your password was changed.</p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:30px;border:1px solid #e3e3e3;border-top:0;">
                      <p style="margin:0;font-family:'Inter Tight',BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:22px;font-weight:400;color:#777777;overflow-wrap:break-word;">We are informing you that the password for your account (<strong>{{email}}</strong>) has been changed.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]>
          </td></tr></table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
