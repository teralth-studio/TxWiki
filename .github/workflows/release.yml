name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*-release'

permissions:
  contents: read

jobs:
  validate:
    name: Security and application tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build:assets

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all Playwright tests
        run: npx playwright test

  publish:
    name: Build and publish signed ZIP
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build:assets

      - name: Create and verify signed release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-release$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH-release." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_KEY GitHub Actions secret with the Ed25519 private signing key." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_PUBLIC_KEY GitHub Actions variable with the matching OpenSSH public key." >&2
            exit 1
          fi

          signing_key="$RUNNER_TEMP/update-signing-key.pem"
          umask 077
          printf '%s' "$UPDATE_SIGNING_KEY" > "$signing_key"
          trap 'rm -f "$signing_key"' EXIT
          export UPDATE_SIGNING_KEY_PATH="$signing_key"

          node scripts/create-release-package.js "$version" "$RELEASE_TAG"
          generated_package="releases/${version}-${RELEASE_TAG}.zip"
          node scripts/verify-update-package.js "$generated_package"

          mkdir -p releases
          mv "$generated_package" "releases/${RELEASE_TAG}.zip"
          test -s "releases/${RELEASE_TAG}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
