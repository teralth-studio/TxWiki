name: Publish Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing numeric version tag on main to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  environment:
    name: Phase 1 - verify release environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and SSH signing keys
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version: ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Expected a version tag such as 1.3.1 or v1.3.1." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main; then
            echo "Release tag $RELEASE_TAG must point to a commit on main." >&2
            exit 1
          fi

          if [[ -z "$UPDATE_SIGNING_KEY" || -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "Configure UPDATE_SIGNING_KEY and UPDATE_SIGNING_PUBLIC_KEY in GitHub Actions." >&2
            exit 1
          fi
          node <<'NODE'
          const crypto = require('node:crypto');

          function parseUpdatePublicKey(value) {
            const text = String(value).trim().replaceAll('\\n', '\n');
            if (text.startsWith('-----BEGIN')) return crypto.createPublicKey(text);
            if (text.length > 1024) throw new Error('SSH public key is too long.');

            const [algorithm, encoded] = text.split(/\s+/, 3);
            if (algorithm !== 'ssh-ed25519' || !encoded || !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded))
              throw new Error('Unsupported SSH public key format.');
            const blob = Buffer.from(encoded, 'base64');
            if (blob.toString('base64') !== encoded) throw new Error('Malformed SSH public key encoding.');

            let offset = 0;
            const readSshString = () => {
              if (offset + 4 > blob.length) throw new Error('Malformed SSH public key.');
              const length = blob.readUInt32BE(offset);
              offset += 4;
              if (length > blob.length - offset) throw new Error('Malformed SSH public key.');
              const field = blob.subarray(offset, offset + length);
              offset += length;
              return field;
            };

            const embeddedAlgorithm = readSshString().toString('ascii');
            const rawKey = readSshString();
            if (offset !== blob.length || embeddedAlgorithm !== 'ssh-ed25519' || rawKey.length !== 32)
              throw new Error('Malformed SSH Ed25519 public key.');
            return crypto.createPublicKey({
              key: Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), rawKey]),
              format: 'der',
              type: 'spki',
            });
          }

          try {
            const privateKey = crypto.createPrivateKey(
              String(process.env.UPDATE_SIGNING_KEY).replaceAll('\\n', '\n'),
            );
            if (privateKey.asymmetricKeyType !== 'ed25519')
              throw new Error('The signing key must be Ed25519.');

            const configuredPublicKey = parseUpdatePublicKey(process.env.UPDATE_PUBLIC_KEY);
            const bundledPublicKey = parseUpdatePublicKey(require('./scripts/update-public-key'));
            const derivedPublicKey = crypto.createPublicKey(privateKey);
            const der = key => key.export({ type: 'spki', format: 'der' });

            if (!der(configuredPublicKey).equals(der(bundledPublicKey)))
              throw new Error('The GitHub public-key variable does not match the updater key in the source.');
            if (!der(derivedPublicKey).equals(der(configuredPublicKey)))
              throw new Error('The private signing key does not match the official updater public key.');
            console.log('SSH signing keys match the official updater key.');
          } catch (error) {
            console.error(`SSH key validation failed: ${error.message}`);
            process.exitCode = 1;
          }
          NODE

          node --version
          npm --version

          if [[ ! -f .env.example ]] || ! git ls-files --error-unmatch .env.example >/dev/null 2>&1; then
            echo "A tracked .env.example is required; keep real credentials in an untracked .env file." >&2
            exit 1
          fi
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env([^/]*)$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Environment files containing secrets must not be committed:" >&2
            printf '%s\n' "$tracked_env_files" >&2
            exit 1
          fi

  package_preparation:
    name: Phase 2 - prepare packages
    needs: environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and verify packages
        run: |
          npm ci
          npm ls --depth=0

  code_validation:
    name: Phase 3 - build and run code tests
    needs: package_preparation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets and run unit tests
        run: |
          set -euo pipefail
          npm run build:assets
          node --test tests/unit/*.test.js

  security:
    name: Phase 4 - security validation
    needs: code_validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Set up Go for secret scanning
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Scan tracked Git history for leaked secrets
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          "$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --config=.gitleaks.toml --redact --exit-code 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze with CodeQL
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          post-processed-sarif-path: ${{ runner.temp }}/codeql-results

      - name: Fail if CodeQL reports security findings
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          from urllib.parse import unquote, urlparse

          directory = pathlib.Path(os.environ["SARIF_DIRECTORY"])
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          sarif_files = sorted(directory.rglob("*.sarif")) if directory.exists() else []
          if not sarif_files:
              sys.exit("CodeQL did not produce SARIF results; refusing to publish.")

          # Validate reviewed inline markers directly when SARIF omits suppression metadata.
          def has_source_annotation(artifact, line, rule_id):
              parsed = urlparse(artifact)
              if parsed.scheme and parsed.scheme != "file":
                  return False
              source_name = unquote(parsed.path) if parsed.scheme == "file" else unquote(artifact)
              source_path = pathlib.Path(source_name)
              if not source_path.is_absolute():
                  source_path = workspace / source_path
              source_path = source_path.resolve()
              try:
                  source_path.relative_to(workspace)
              except ValueError:
                  return False
              if not source_path.is_file():
                  return False

              lines = source_path.read_text(encoding="utf-8").splitlines()
              try:
                  finding_line = int(line)
              except (TypeError, ValueError):
                  return False
              marker = re.compile(
                  r"(?:^|\s)//\s*codeql\[" + re.escape(rule_id) + r"\](?:\s|$)"
              )
              return any(
                  marker.search(lines[index])
                  for index in (finding_line - 2, finding_line - 1)
                  if 0 <= index < len(lines)
              )

          findings = []
          source_suppressions = []
          for sarif_file in sarif_files:
              report = json.loads(sarif_file.read_text(encoding="utf-8"))
              for run in report.get("runs", []):
                  rules = {
                      rule.get("id"): rule.get("name", rule.get("id", "unknown"))
                      for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for result in run.get("results", []):
                      suppression = any(
                          item.get("kind") == "inSource" and item.get("status") == "accepted"
                          for item in result.get("suppressions", [])
                      )
                      location = (result.get("locations") or [{}])[0]
                      physical = location.get("physicalLocation", {})
                      artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
                      line = physical.get("region", {}).get("startLine", "?")
                      rule_id = result.get("ruleId", "unknown")
                      if suppression:
                          source_suppressions.append(f"{artifact}:{line}: {rule_id} (SARIF inSource)")
                          continue
                      if has_source_annotation(artifact, line, rule_id):
                          source_suppressions.append(f"{artifact}:{line}: {rule_id} (reviewed source annotation)")
                          continue
                      findings.append(
                          f"{artifact}:{line}: {rules.get(rule_id, rule_id)}"
                      )

          if source_suppressions:
              print("Reviewed in-source CodeQL suppressions:")
              print("\n".join(source_suppressions))
          if findings:
              print("CodeQL findings must be resolved before a release:", file=sys.stderr)
              print("\n".join(findings), file=sys.stderr)
              sys.exit(1)
          print("CodeQL produced no security findings.")
          PY

  playwright:
    name: Phase 5 - Playwright (${{ matrix.browser }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: ''
          - browser: firefox
            shard: ''
          - browser: webkit
            shard: '1/2'
            specs: tests/admin-updates-runtime.spec.js tests/administration-layout.spec.js
          - browser: webkit
            shard: '2/2'
            specs: tests/documentation-header.spec.js tests/example.spec.js tests/maintenance-runtime.spec.js
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.specs || '' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Phase 6 - publish official GitHub Release
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build:assets

      - name: Create and verify signed release package
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Expected a version tag such as 1.3.1 or v1.3.1." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main; then
            echo "Release tag $RELEASE_TAG must point to a commit on main." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_KEY GitHub Actions secret with the Ed25519 private signing key." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_PUBLIC_KEY GitHub Actions variable with the matching OpenSSH public key." >&2
            exit 1
          fi

          signing_key="$RUNNER_TEMP/update-signing-key.pem"
          umask 077
          printf '%s' "$UPDATE_SIGNING_KEY" > "$signing_key"
          trap 'rm -f "$signing_key"' EXIT
          export UPDATE_SIGNING_KEY_PATH="$signing_key"
          export UPDATE_PUBLIC_KEY

          node scripts/create-release-package.js "$version" "$RELEASE_TAG"
          generated_package="releases/${version}-${RELEASE_TAG}.zip"
          node scripts/verify-update-package.js "$generated_package"

          mkdir -p releases
          mv "$generated_package" "releases/${RELEASE_TAG}.zip"
          test -s "releases/${RELEASE_TAG}.zip"

      - name: Upload signed ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag || github.ref_name }}.zip
          path: releases/${{ inputs.release_tag || github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
