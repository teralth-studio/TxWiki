name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*-release'
      - 'v*.*.*-beta'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Phase 1 - verify source, GitHub environment, and token policy
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-release$ ]]; then
            source_branch=main
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta(\.(0|[1-9][0-9]*))?$ ]]; then
            source_branch=beta
          else
            echo "Expected vMAJOR.MINOR.PATCH-release or vMAJOR.MINOR.PATCH-beta[.N]." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "origin/${source_branch}"; then
            echo "Release tag $RELEASE_TAG must point to a commit on the $source_branch branch." >&2
            exit 1
          fi

          node --version
          npm --version
          npm ci
          npm ls --depth=0

          if [[ ! -f .env.example ]] || ! git ls-files --error-unmatch .env.example >/dev/null 2>&1; then
            echo "A tracked .env.example is required; keep real credentials in an untracked .env file." >&2
            exit 1
          fi
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env([^/]*)$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Environment files containing secrets must not be committed:" >&2
            printf '%s\n' "$tracked_env_files" >&2
            exit 1
          fi

      - name: Phase 2 - build and run code tests
        run: |
          set -euo pipefail
          npm run build:assets
          node --test tests/unit/*.test.js

      - name: Phase 3 - audit dependencies
        run: npm audit --audit-level=low

      - name: Set up Go for secret scanning
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Scan tracked Git history for leaked secrets
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          "$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --exit-code 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          post-processed-sarif-path: ${{ runner.temp }}/codeql-results

      - name: Fail if CodeQL reports security findings
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          directory = pathlib.Path(os.environ["SARIF_DIRECTORY"])
          sarif_files = sorted(directory.rglob("*.sarif")) if directory.exists() else []
          if not sarif_files:
              sys.exit("CodeQL did not produce SARIF results; refusing to publish.")

          findings = []
          for sarif_file in sarif_files:
              report = json.loads(sarif_file.read_text(encoding="utf-8"))
              for run in report.get("runs", []):
                  rules = {
                      rule.get("id"): rule.get("name", rule.get("id", "unknown"))
                      for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for result in run.get("results", []):
                      location = (result.get("locations") or [{}])[0]
                      physical = location.get("physicalLocation", {})
                      artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
                      line = physical.get("region", {}).get("startLine", "?")
                      rule_id = result.get("ruleId", "unknown")
                      findings.append(
                          f"{artifact}:{line}: {rules.get(rule_id, rule_id)}"
                      )

          if findings:
              print("CodeQL findings must be resolved before a release:", file=sys.stderr)
              print("\n".join(findings), file=sys.stderr)
              sys.exit(1)
          print("CodeQL produced no security findings.")
          PY

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Phase 4 - run all Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Phase 5 - publish signed GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build:assets

      - name: Create and verify signed release package
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-release$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            source_branch=main
            is_prerelease=false
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta(\.(0|[1-9][0-9]*))?$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            source_branch=beta
            is_prerelease=true
          else
            echo "Expected vMAJOR.MINOR.PATCH-release or vMAJOR.MINOR.PATCH-beta[.N]." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "origin/${source_branch}"; then
            echo "Release tag $RELEASE_TAG must point to a commit on the $source_branch branch." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_KEY GitHub Actions secret with the Ed25519 private signing key." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "Configure the UPDATE_SIGNING_PUBLIC_KEY GitHub Actions variable with the matching OpenSSH public key." >&2
            exit 1
          fi

          signing_key="$RUNNER_TEMP/update-signing-key.pem"
          umask 077
          printf '%s' "$UPDATE_SIGNING_KEY" > "$signing_key"
          trap 'rm -f "$signing_key"' EXIT
          export UPDATE_SIGNING_KEY_PATH="$signing_key"

          node scripts/create-release-package.js "$version" "$RELEASE_TAG"
          generated_package="releases/${version}-${RELEASE_TAG}.zip"
          node scripts/verify-update-package.js "$generated_package"

          mkdir -p releases
          mv "$generated_package" "releases/${RELEASE_TAG}.zip"
          test -s "releases/${RELEASE_TAG}.zip"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Upload signed ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag || github.ref_name }}.zip
          path: releases/${{ inputs.release_tag || github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IS_PRERELEASE: ${{ steps.package.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          beta_notes="Advertencia: versión beta experimental desde la rama beta. Instálala y úsala bajo tu propio riesgo."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" --clobber
            if [[ "$IS_PRERELEASE" == true ]]; then
              gh release edit "$RELEASE_TAG" --prerelease --notes "$beta_notes"
            fi
          elif [[ "$IS_PRERELEASE" == true ]]; then
            gh release create "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --notes "$beta_notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "releases/${RELEASE_TAG}.zip" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
