name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    name: Playwright (${{ matrix.browser }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: ''
          - browser: firefox
            shard: ''
          - browser: webkit
            shard: '1/2'
            specs: tests/admin-updates-runtime.spec.js tests/administration-layout.spec.js
          - browser: webkit
            shard: '2/2'
            specs: tests/documentation-header.spec.js tests/example.spec.js tests/maintenance-runtime.spec.js
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.specs || '' }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
        path: playwright-report/
        retention-days: 30
