<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111214" />
    <title>Updating...</title>
    <link rel="stylesheet" href="/maintenance.css" />
    <script src="/maintenance.js" defer></script>
  </head>
  <body class="maintenance-body">
    <main class="maintenance-card" aria-labelledby="maintenanceTitle">
      <div class="maintenance-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="maintenanceTitle">Updating...</h1>
      <p class="maintenance-message">The site is temporarily unavailable.</p>
      <div
        class="maintenance-progress"
        id="maintenanceProgress"
        role="progressbar"
        aria-label="Update progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="maintenance-track" cx="60" cy="60" r="52"></circle>
          <circle
            class="maintenance-arc"
            id="maintenanceArc"
            cx="60"
            cy="60"
            r="52"
            pathLength="100"
            stroke-dasharray="100"
            stroke-dashoffset="100"
          ></circle>
        </svg>
        <span id="maintenancePercent">0%</span>
      </div>
      <p class="maintenance-stage" id="maintenanceStage" role="status" aria-live="polite">
        Preparing the update...
      </p>
      <div class="maintenance-current-phase">
        <span id="maintenanceCurrentPhase">Preparation</span>
        <strong id="maintenanceCurrentPhasePercent">0%</strong>
      </div>
      <div
        class="maintenance-phase-track"
        id="maintenanceCurrentPhaseBar"
        role="progressbar"
        aria-label="Current phase progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span></span>
      </div>
      <ol class="maintenance-phases">
        <li id="maintenancePhase-preparation">
          <span>Preparation</span>
          <small id="maintenancePhaseState-preparation">Pending</small>
          <div class="maintenance-phase-item-track" id="maintenancePhaseBar-preparation" role="progressbar" aria-label="Preparation phase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </li>
        <li id="maintenancePhase-verification">
          <span>Verification</span>
          <small id="maintenancePhaseState-verification">Pending</small>
          <div class="maintenance-phase-item-track" id="maintenancePhaseBar-verification" role="progressbar" aria-label="Verification phase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </li>
        <li id="maintenancePhase-installation">
          <span>Installation</span>
          <small id="maintenancePhaseState-installation">Pending</small>
          <div class="maintenance-phase-item-track" id="maintenancePhaseBar-installation" role="progressbar" aria-label="Installation phase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </li>
        <li id="maintenancePhase-finalization">
          <span>Finalization</span>
          <small id="maintenancePhaseState-finalization">Pending</small>
          <div class="maintenance-phase-item-track" id="maintenancePhaseBar-finalization" role="progressbar" aria-label="Finalization phase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </li>
      </ol>
      <span class="maintenance-rule" aria-hidden="true"></span>
      <p class="maintenance-footnote">Please keep this page open.</p>
    </main>
  </body>
</html>
